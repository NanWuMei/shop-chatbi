# ChatBI web 静态托管 + /api 同源反代（SDD §10：容器内 nginx 同源，杜绝 CORS）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 五路由兜底（/chat /chat/:sessionId /reports /reports/:reportId /sessions）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代到 api 服务（上游由 $API_UPSTREAM 注入：Compose 内为 http://api:8000，Render 为 api 服务公网地址）
    # 本文件在容器启动时经 envsubst 生成（官方 nginx 镜像 /etc/nginx/templates 机制）
    location /api/v1/ {
        proxy_pass ${API_UPSTREAM}/api/v1/;
        proxy_ssl_server_name on;   # HTTPS 上游必须带 SNI，否则 Render LB 拒握手 → 502
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;   # 必须带上游域名：Render 按 Host 路由，用 $host 会回环到 web 自己
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # SSE 长连接
        proxy_buffering off;       # SSE 必需：关闭缓冲逐帧透传
        proxy_cache off;
        proxy_set_header Connection "";
    }
}
