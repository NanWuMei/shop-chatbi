# ChatBI Render 免费版蓝图（公网 Demo 部署）
# 两个 Docker 服务均从仓库根构建；数据库直连 Supabase 云库（不在 Render 起库）。
# 用法：Render Dashboard → New → Blueprint → 选本仓库 → 填 sync:false 的密钥值 → Apply。
services:
  # 后端 FastAPI（uvicorn 单 worker；端口由 Render 注入的 $PORT 决定）
  - type: web
    name: chatbi-api
    runtime: docker
    dockerfilePath: ./backend_service/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: RESOURCES_PATH
        value: /app/algorithm/resources
      # 以下值从 backend_service/.env 复制到 Dashboard（密钥不入库）
      - key: APP_DATABASE_URL
        sync: false
      - key: ANALYTICS_DATABASE_URL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        sync: false
      - key: EMB_BASE_URL
        sync: false
      - key: EMB_API_KEY
        sync: false
      - key: EMB_MODEL
        sync: false
      - key: EMB_DIM
        sync: false
  # 前端静态站点（nginx：托管 dist + /api 反代到 chatbi-api）
  - type: web
    name: chatbi-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    region: singapore
    plan: free
    envVars:
      # nginx 反代上游 = api 服务的 Render 地址（首次部署后若域名不同需改这里）
      - key: API_UPSTREAM
        value: https://chatbi-api.onrender.com
